services:
  mysql:
    image: mysql:8.4
    container_name: coop_jobs_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-coop_jobs}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  selenium:
    image: selenium/standalone-chromium:latest
    container_name: coop_jobs_selenium
    shm_size: 2gb
    environment:
      SE_SCREEN_WIDTH: "1440"
      SE_SCREEN_HEIGHT: "900"
      SE_VNC_NO_PASSWORD: "true"
      SE_VNC_VIEW_ONLY: "false"
    ports:
      - "7900:7900"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4444/status | grep -q 'ready' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: coop_jobs_server
    restart: unless-stopped
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-coop_jobs}
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-rootpassword}
      SERVER_PORT: 8000
      SELENIUM_URL: http://selenium:4444/wd/hub
      BROWSER_URL: http://localhost:7900/vnc_lite.html?scale=true
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
      selenium:
        condition: service_healthy

  web:
    build:
      context: ./web
    container_name: coop_jobs_web
    ports:
      - "5300:5173"

volumes:
  mysql_data: